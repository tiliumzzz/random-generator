name: Python CI
on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        cd backend
        py -m pip install -r requirements.txt
    
    - name: Run tests
      run: |
        cd backend
        py -m pytest tests/ -v
    
    - name: Check imports
      run: |
        cd backend
        py -c "from app.database import load_quotes; print('Import successful')"
    
    - name: Check JSON file
      run: |
        cd backend
        py -c "import json; json.load(open('app/quotes.json', encoding='utf-8-sig'))"